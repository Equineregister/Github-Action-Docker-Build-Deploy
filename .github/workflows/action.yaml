---
name: Docker Build and Deploy
on:
  workflow_call:
    secrets:
      bitbucketSSHKey:
        required: true
      githubSSHKey:
        required: true
      githubToken:
        required: true
      awsRegion:
        required: true
      awsRoleToAssume:
        required: true
jobs:
  docker_build:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.bitbucketSSHKey }}
            ${{ secrets.githubSSHKey }}
            
      - name: Configure aws credentials # https://github.com/aws-actions/configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.awsRoleToAssume }}
          aws-region: ${{ secrets.awsRegion }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get current timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%s')" >> $GITHUB_ENV

      - name: Version
        id: version
        run: echo "VERSION=${GITHUB_REF##*/}-${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Docker tags
        id: docker_tags
        env:
          DOCKER_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "GITHUB_REF=${GITHUB_REF}"
          DOCKER_REPOSITORY="${DOCKER_REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF}" == "refs/heads/develop" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="${DOCKER_REPOSITORY}:${GITHUB_REF##*/}-${TIMESTAMP}-${GITHUB_SHA:0:8}"
          elif [[ "${GITHUB_REF}" == *refs/tags/* ]]; then
            TAGS="${DOCKER_REPOSITORY}:${GITHUB_REF##*/}"
          fi
          echo "DOCKER_TAGS=${TAGS}" >> $GITHUB_ENV
        shell: bash

      - name: Set up Docker
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || contains(github.ref, 'refs/tags/')) && github.event_name != 'pull_request' }}
          tags: ${{ env.DOCKER_TAGS }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.githubToken }}
            VERSION=${{ env.VERSION }}
          ssh: default=${{ env.SSH_AUTH_SOCK }}
