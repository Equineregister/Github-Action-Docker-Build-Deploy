---
name: Docker Build and Deploy
on:
  workflow_call:
    secrets:
      bitbucketSSHKey:
        required: true
      sshKey:
        required: true
      awsRegion:
        required: true
      awsRoleToAssume:
        required: true
jobs:
  docker_build:
    runs-on: ubuntu-20.04
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.bitbucketSSHKey }}
            ${{ secrets.sshKey }}
            
      - name: Configure aws credentials # https://github.com/aws-actions/configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.awsRoleToAssume }}
          aws-region: ${{ secrets.awsRegion }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get current timestamp
        id: timestamp
        run: echo "now=$(date +'%s')" >> $GITHUB_OUTPUT

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF##*/}-${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT

      - name: Docker tags
        id: docker_tags
        env:
          DOCKER_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          DOCKER_REPOSITORY="${DOCKER_REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            TAGS="${DOCKER_REPOSITORY}:${GITHUB_REF##*/}-${{ steps.timestamp.outputs.now }}-${GITHUB_SHA:0:8}"
          elif [[ "${GITHUB_REF}" == "refs/tags/*" ]]; then
            TAGS="${DOCKER_REPOSITORY}:${GITHUB_REF##*/}"
          fi
          echo "DOCKER_TAGS=${TAGS}" >> $GITHUB_ENV
        shell: bash

      - name: Set up Docker
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.DOCKER_TAGS }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.READ_PACKAGES_TOKEN }}
            VERSION=${{ env.VERSION }}
          ssh: default=${{ env.SSH_AUTH_SOCK }}
